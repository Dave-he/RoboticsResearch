# RoboticsResearch - 关键词与查询式配置
# 维护原则:每月迭代一次,统计漏检 / 误报后调整
#
# ============================================================================
# ⚠️ 重要:本文件是**协议层参考文档**,不是抓取管线的可执行配置。
# ============================================================================
#
# 2026-10-26 定位到的失效模式(与同日的综述归档出口问题同类):
# **本文件此前从未被任何脚本读取** —— 它看起来像「关键词的唯一来源」,
# 但实际抓取行为由 `scripts/daily_robotics_research.py` 里的三个**硬编码
# 列表**决定,三者互不相干,且**与本文件已经发生静默分歧**:
#
#   | 实际使用的列表           | 脚本位置                          | 本文件是否有对应项 |
#   |--------------------------|-----------------------------------|-------------------|
#   | arXiv 查询式             | `primary_terms`(fetch_arxiv)     | ❌ **完全没有**    |
#   | GitHub 查询式            | `GITHUB_QUERIES`                  | ⚠️ **有但已分歧**(本文件 5 条 / 脚本 8 条)|
#   | HuggingFace 查询式       | `HF_QUERIES`                      | ⚠️ 有但已分歧      |
#   | 评分用关键词             | `ARXIV_TERMS`(keyword_score)      | ⚠️ 有,量级不同    |
#   | 子领域分类               | `classify_paper` 的 buckets        | ❌ 没有            |
#
# **实际后果(已修)**:协议 §1 把 soft_robotics 列为在范围内,但
# `primary_terms` 里**没有软体查询式** —— 该方向只能靠其它查询式顺带命中。
# 实证:2026-09-29 之后**再无一篇软体论文进入语料**;navigation 方向
# 同样**没有独立查询式**(近 8 天仅顺带命中 1 篇)。
# 2026-10-26 已给 `primary_terms` 补上 "soft robot" / "navigation robot" /
# "LiDAR SLAM" / "tactile robot",并把 soft_robotics 的分类改为前置判定。
#
# 📌 **维护纪律(自 2026-10-26 起)**:
#   1. **改查询式 → 改脚本**,并回来更新本文件的对应小节;
#   2. 本文件保留作为**协议层意图声明**与**评分词表**的说明;
#   3. **不要**因为「本文件里写了」就认为该方向已被检索覆盖 ——
#      判断某个方向是否真的被跟踪,要看 `primary_terms`,不是看本文件。
#      这正是本次踩到的坑。

domain:
  name: "通用机器人技术"
  slug: "robotics"
  arxiv_categories:
    - "cs.RO"   # Robotics
    - "cs.AI"   # AI(具身智能相关)
    - "cs.CV"   # 视觉
    - "cs.LG"   # 机器学习
    - "cs.MA"   # 多智能体

# === 核心检索关键词组 ===
keyword_groups:
  # 组 1:核心方法 / 范式
  core_methods:
    - "manipulation"
    - "dexterous manipulation"
    - "grasping"
    - "imitation learning"
    - "reinforcement learning for robotics"
    - "sim-to-real"
    - "sim2real"
    - "embodied AI"
    - "embodied agent"
    - "robot foundation model"
    - "vision-language-action"
    - "vision language action model"
    - "VLA model"

  # 组 2:具身智能大模型
  foundation_models:
    - "RT-2"
    - "RT-X"
    - "OpenVLA"
    - "Octo"
    - "Pi0"
    - "π0"
    - "HPT"
    - "GR-1"
    - "GR-2"
    - "DreamerV3"
    - "Gato"
    - "PaLM-E"
    - "RoboFlamingo"

  # 组 3:人形 / 仿生
  humanoid:
    - "humanoid robot"
    - "humanoid locomotion"
    - "bipedal locomotion"
    - "whole-body control"
    - "legged robot"
    - "quadruped"

  # 组 4:感知 / SLAM / 导航
  perception_slam:
    - "visual SLAM"
    - "LiDAR SLAM"
    - "visual odometry"
    - "neural SLAM"
    - "neural radiance field"  # 与 3D 感知交叉
    - "3D Gaussian Splatting"  # SLAM 与渲染交叉
    - "visual navigation"
    - "path planning"

  # 组 5:硬件 / 灵巧手 / 触觉
  hardware:
    - "dexterous hand"
    - "tactile sensing"
    - "force control"
    - "compliant control"
    - "soft robotics"

  # 组 6:仿真 / 数据集
  simulation_data:
    - "Isaac Sim"
    - "MuJoCo"
    - "SAPIEN"
    - "ManiSkill"
    - "RoboSuite"
    - "DROID dataset"
    - "Bridge dataset"
    - "Open X-Embodiment"

  # 组 7:行业 / 玩家
  industry_players:
    - "Figure AI"
    - "Tesla Optimus"
    - "1X Technologies"
    - "Unitree"
    - "Boston Dynamics"
    - "Agility Robotics"
    - "Physical Intelligence"
    - "Skild AI"
    - "Covariant"

  # 组 8:测试时 RL / 自我改进(2026-06-30 新增)
  test_time_rl:
    - "test-time reinforcement learning"
    - "test-time adaptation VLA"
    - "self-improving robot policy"
    - "self-bootstrapping VLA"
    - "confidence-driven RL"
    - "intrinsic reward VLA"
    - "world model imagination"
    - "compositional world model"

  # 组 9:多模态感知 VLA(2026-06-30 新增)
  multimodal_sensing:
    - "multimodal sensing VLA"
    - "sensor-masked image"
    - "grounded sensor image"
    - "tool call VLA"
    - "OmniVLA"
    - "MuseVLA"
    - "WholeBodyVLA"
    - "force-tactile VLA"

  # 组 10:新增行业玩家(2026-06-30 新增)
  new_industry_players:
    - "AGIBOT"
    - "Matrix Robotics"
    - "EngineAI"
    - "RoboScience"
    - "Boardwalk Robotics"

# === 噪声词(在摘要中匹配则降权) ===
noise_terms:
  - "purely theoretical"
  - "no robotics"
  - "biological only"

# === 评分权重 ===
scoring:
  title_match_weight: 5
  abstract_match_weight: 2
  code_available_bonus: 3
  recent_30d_bonus: 2
  top_lab_bonus: 4   # Google DeepMind, Meta FAIR, Stanford, MIT, BAIR, NVIDIA, SUSTech

top_labs:
  - "Google DeepMind"
  - "Meta FAIR"
  - "Stanford"
  - "MIT"
  - "Berkeley"
  - "CMU"
  - "NVIDIA"
  - "SUSTech"
  - "Tsinghua"
  - "SJTU"
  - "PKU"

# === 数据源 ===
sources:
  arxiv:
    enabled: true
    max_results_per_query: 20
    max_total_results: 80
  github:
    enabled: true
    queries:
      - "robotics"
      - "manipulation"
      - "humanoid"
      - "dexterous"
      - "VLA model"
    min_stars: 50
  huggingface:
    enabled: true
    queries:
      - "robotics"
      - "manipulation"
      - "vla"
