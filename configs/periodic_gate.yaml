# 周期产物门禁的基线配置
#
# 用途:scripts/check_periodic_artifacts.py 用它判断「哪些周期产物本该存在」。
#
# 为什么需要基线
# --------------
# 本项目有两个阶段,产物节奏完全不同:
#
#   阶段一(2026-06-07 ~ 2026-09-27):骨架期
#     - 抓取是手动的、不连续(2026-06 只有 6 天)
#     - 还没有周报/月度合成的节奏
#     - 期间已产出的 2026-06 深度探索文档命名与后来的约定不同
#
#   阶段二(2026-09-28 起):闭环期
#     - 每日抓取由 systemd timer + GitHub Actions 双调度,连续运行
#     - 协议 §7 的每周 / 每月节奏开始生效
#
# 若不对阶段一设基线,门禁会报出 38 条历史遗留错误,淹没真正的新问题。
# **基线只豁免「早于该日期的周期」,不豁免基线之后的任何缺失。**

# 每日抓取产物(JSON + digest)从该日起应当逐日齐全
daily_since: "2026-07-01"

# 周报从该周起应当齐全(2026-09-28 = 2026-W40,本项目第一个有周报的周)
weekly_since: "2026-W40"

# 月度合成从该月起应当齐全
monthly_since: "2026-07"

# 允许文件名带后缀(例如 2026-06-30_深度探索_xxx.md 也算作 2026-06 的月度合成)
allow_prefix_match: true

# 已归档的历史断档。
#
# 这些周期确实发生了「0 篇研读」,但已在 docs/research/ 的对应周报/月度
# 合成中做了根因分析与复盘,属于**已知且已记录**的历史事实,不再作为
# 每次门禁的新告警重复出现。
#
# 任何**不在此列表中**的零产出周/月,都会被门禁报为新问题 —— 这正是
# 门禁要捕捉的东西。
acknowledged_stalls:
  # 2026-08 整月零产出:抓取正常(29 天 2,419 篇),但深读流程断档。
  # 根因与复盘见 docs/research/2026-08_robotics_synthesis.md。
  - "2026-08"

# ---------------------------------------------------------------------------
# 内容契约:产物「存在」之外,还必须「有内容」
# ---------------------------------------------------------------------------
#
# 门禁第一版只验文件存在 —— 一份空壳周报照样能通过。内容契约解决这一条。
#
# 每条 required 是一个「多选一」:任一 pattern 命中即视为满足该条。
# 这样安排是为了容纳本项目真实存在的两种合法形态:
#   · 常规周报 / 月报(数据表 + 研读清单 + 洞察 + 必查)
#   · 诊断式月报(2026-08:失效点 / 代价 / 已落地修复 / 尚未修复)
#   · 深度探索文档(2026-06:执行摘要 + 编号章节 + 来源)
#
# 判定「空壳」用的是三条硬指标,任一不满足即判不合格:
#   · 正文行数 >= min_content_lines
#   · 至少含 1 个 markdown 表格
#   · required 全部命中
#
# ⚠️ 格式约束:本文件刻意保持**完全扁平**(无嵌套映射、无内联列表对象)。
# 因为 check_periodic_artifacts.py 的配置解析有一条「无 PyYAML 时的简易回退
# 解析器」,只有扁平结构才能保证 PyYAML 与回退解析器**逐字段一致**。
# 早先的嵌套写法(content_contract: weekly: required: [{name, pattern}])会让
# 回退解析器静默把契约解析成空 —— 即门禁在缺 PyYAML 的机器上悄悄失效。
# 契约项统一写成 "名称=正则" 字符串。

contract_weekly_min_lines: 25
contract_weekly_required:
  - "数据统计=抓取天数|命中论文|本周数据|论文数"
  - "研读清单=研读报告|arxiv[.]org/abs/|零产出|0 篇"
  - "主题洞察=洞察|教训|复盘|发现"
  - "后续必查=必查|教训|后续行动"

contract_monthly_min_lines: 25
contract_monthly_required:
  - "数据统计=抓取天数|命中论文|本月数据|论文数|深读率|来源数"
  - "研读清单=研读报告|arxiv[.]org/abs/|零产出|0 篇|失效点"
  - "主题洞察=洞察|关键发现|失效点|结论"
  - "后续行动=必查|尚未修复|建议|下一步|待办|教训"
