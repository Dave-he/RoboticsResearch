name: Daily Robotics Research

on:
  # 06:30 Beijing time (UTC+8) = 22:30 UTC the previous day
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      max_arxiv:
        description: "Max arXiv results to fetch"
        required: false
        default: "80"
        type: string
      min_stars:
        description: "Minimum GitHub stars filter"
        required: false
        default: "50"
        type: string

permissions:
  contents: write

# Serialise overlapping runs of this workflow (e.g. a manual workflow_dispatch
# landing on top of the nightly schedule, or the runner being slow and GH
# queuing the next day behind it).  cancel-in-progress is deliberately false:
# a half-finished digest run must not be cancelled mid-push.
#
# NOTE: this lock only serialises GitHub Actions against *itself*.  It does NOT
# lock out the local systemd timer (robotics-daily-research.timer, 07:00 CST),
# which runs the same script outside Actions.  The two still race on the push;
# --skip-if-done is what keeps the loser from producing a second artifact.
concurrency:
  group: daily-robotics-research
  cancel-in-progress: false

jobs:
  research-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Defaults are aligned with scripts/run_daily_robotics_task.sh so that
          # if this job ever does the work, it produces an equivalent artifact.
          # --skip-if-done is what keeps the two schedulers serial: this job runs
          # at 06:30 CST but the runner is UTC, so its run_date is the *previous*
          # calendar date -- the one the local systemd timer already generated and
          # pushed ~23.5h earlier. Without the guard this job rewrites that file
          # with a narrower fetch and the push is rejected (non-fast-forward).
          max_arxiv="${{ github.event.inputs.max_arxiv || '80' }}"
          min_stars="${{ github.event.inputs.min_stars || '50' }}"
          python scripts/daily_robotics_research.py \
            --max-arxiv "${max_arxiv}" \
            --github-per-query 12 \
            --hf-per-query 8 \
            --min-stars "${min_stars}" \
            --output-root . \
            --skip-if-done

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs papers analysis
          if ! git diff --cached --quiet; then
            run_date=$(date -u +%F)
            paper_count=$(jq '.papers | length' papers/daily/${run_date}_robotics_research.json 2>/dev/null || echo "?")
            git commit -m "chore(daily): update robotics research digest ${run_date} (${paper_count} papers)"
            git push
          else
            echo "No changes to commit."
          fi
